<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Citações e Ênfase</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- blockquote → citação longa, de outra fonte -->
    <blockquote cite="https://site-da-fonte.com">
        <p>O Senhor dos Anéis é uma das maiores obras da literatura fantástica.</p>
    </blockquote>

    <!-- q → citação curta, inline -->
    <p>Como dizia Tolkien: <q>Nem todos que vagam estão perdidos.</q></p>

    <!-- cite → título de uma obra (obras, filmes, músicas etc)-->
    <p>Eu indico o livro <cite>Mythos</cite> escrito por Stephen Fry</p>

    <!-- em → ênfase (itálico com significado) -->
    <p>Você <em>precisa</em> ler esse livro.</p>

    <!-- strong → importância (negrito com significado) -->
    <p><strong>Atenção:</strong> o prazo termina hoje.</p>

</body>

</html>
