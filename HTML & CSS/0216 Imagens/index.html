<!-- 
 src;
 atributo que define o caminho da imagem
 ________________________________________

 alt;
 texto alternativo que será lido por leitores de tela(acessibilidade), robôs e que irá aparecer caso a imagem não carregue

_________________________________________

max-width: 100%;
Geralmente definimos um width máximo de 100% para a imagem, assim ela não cresce além do elemento pai (body, corpo do site inteiro)
_________________________________________
img;

a tag img é utilizada para adicionarmos imagens à nossa página
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Imagens no grugru</title>
</head>
<body>
    <div>   
        <img src="./img/bicicleta-1200-800.jpg" alt="Bicicleta Preta">
        <img src="./img/bikcraft.svg" alt="Bicicleta Preta">
        <img src="./img/bikcraft.png" alt="Bicicleta Preta">
    </div>
</body>
</html>
