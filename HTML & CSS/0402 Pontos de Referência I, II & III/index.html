<!-- LANDMARKS - Tags semânticas do HTML5 -->

<!-- <header> → Cabeçalho do site (logo, nav, info introdutória) 
     ⚠️ Só vira landmark se NÃO estiver dentro de main, section, article ou aside -->

<!-- <nav> → Menu de navegação -->

<!-- <main> → Conteúdo principal da página -->

<!-- <section aria-label="nome"> → Agrupa conteúdo por região/tema
     ⚠️ O conteúdo precisa do contexto da página para fazer sentido -->

<!-- <article aria-labelledby="id-do-titulo"> → Conteúdo autoexplicativo
     (faz sentido sozinho, sem precisar do resto da página)
     Ex: post de blog, card de produto, artigo -->

<!-- <aside> → Conteúdo complementar ao principal
     Ex: posts relacionados, glossário, informações extras -->

<!-- <footer> → Rodapé da página -->

<!-- aria-label → Título da região INVISÍVEL visualmente, mas lido pelo leitor de tela -->
<!-- aria-labelledby → Aponta para um título que JÁ EXISTE na tela pelo id -->
