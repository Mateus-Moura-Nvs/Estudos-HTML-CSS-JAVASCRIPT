<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>

<!-- UL - Lista sem ordem (unordered list) -->
<!-- Cada item = <li> -->
<!-- Leitor de tela anuncia quantos itens tem na lista -->
<ul>
    <li>Item 1</li>
    <li>Item 2</li>
</ul>

<!-- OL - Lista com ordem (ordered list) -->
<!-- Igual a ul, mas numerada automaticamente -->
<ol>
    <li>Primeiro</li>
    <li>Segundo</li>
</ol>

<!-- DL - Lista de definição (description list) -->
<!-- dt = termo | dd = descrição do termo -->
<dl>
    <dt>HTML</dt>
    <dd>Linguagem de marcação para estruturar páginas web</dd>
</dl>

<!-- Lista dentro de lista: coloca um <ul> ou <ol> dentro de um <li> -->
<ul>
    <li>Frutas
        <ul>
            <li>Banana</li>
            <li>Uva</li>
        </ul>
    </li>
</ul>

</body>
</html>
